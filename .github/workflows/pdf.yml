
name: Build and Deploy Website (Refresh PDF)

on:
  push:
    branches:
      - main

  schedule:
    # First day of every month at 08:17 UTC
    - cron: '17 8 1 * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create or Delete Folder 
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/cv
          rm -f public/cv/*.pdf

      - name: Generate English CVs
        run: yarn tsx tools/generate-resume.tsx

      - name: Generate Spanish CVs
        run: yarn tsx tools/generate-resume.tsx --locale es

      - name: Copy CVs to Next.js public directory
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated CVs:"
          ls -lh public/cv/*.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Next.js site
        run: yarn build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
